[table-cell-block]
size = 1280x720
vault = fixtures/table-vault
view = open:Settings.md
steps = click:@Markdown preview|wait:4|click:@people folder|wait:3|key:End|wait:2|key:shift+ArrowRight|wait:4|key:shift+ArrowDown|wait:5|click:@Bold|wait:6|key:Backspace|wait:6|key:Escape|key:Escape|wait:3

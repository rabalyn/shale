# The recipes of the short videos of the user guide, which are stored in docs/userguide/z_media/clips/
# (DEV-019). One section per clip: [name] makes name.webm with one `shale --record` run;
# `docs/screenshots/regen-clips.sh` runs them (all, or the names it is given).
#
# The keys are those of recipes.conf (size, view, steps, vault, env), except that docs is note:
#   note   the note of the user guide (below docs/userguide/, without .md) that embeds the clip with ![[name.webm]]
#
# One frame drawn is 1/30 s of the clip. The script does a step every 6 frames (0.2 s), so `wait:5`
# waits a second; the clip starts a beat before the first step and shows the end for a second. There
# is no mouse pointer in a clip, so choose what changes on its own. Keep the clips short (a few
# seconds, well under 1 MB): they are plain git files, and every version stays in the history (moving
# them to Git LFS is DEV-021, deferred: raba/shale#233).

[preview-toggle]
size = 1280x720
steps = wait:3|click:@Markdown preview|wait:8|click:@Raw markdown|wait:5
note = Editor

[link-completion]
size = 1280x720
steps = focus-end|key:Enter|key:Enter|text:Open [[|wait:5|text:I|wait:2|text:d|wait:5|key:Enter|wait:6
note = Notes and links

[graph-drag]
size = 1280x720
view = graph
steps = wait:3|drag:@Welcome>800,200|wait:8|drag:@Ideas>300,500|wait:8
note = Graph and backlinks

[image-resize]
size = 1280x720
vault = fixtures/media-vault
view = open:Harbour.md
steps = hover:600,300|wait:4|drag:711,469>891,469|wait:4|hover:865,277|wait:2|click:865,277|wait:6|key:Escape|wait:3|hover:823,277|wait:2|click:823,277|wait:8
note = Editor

[video-resize]
size = 1280x720
vault = fixtures/media-vault
view = open:Waves.md
steps = hover:600,300|wait:4|drag:771,433>871,433|wait:4|hover:845,277|wait:2|click:845,277|wait:6|key:Escape|wait:3

# The recipes of the screenshots of the user guide, which are stored in
# docs/userguide/z_media/screenshots/ (DEV-007). One section per picture: [name] makes
# name.png with one `shale --screenshot` run; regen.sh runs them (all, or the names it is given).
#
#   size   window size in points, default 1360x840
#   view   --view: tasks graph boards drawing reading calendar calendar-side mail social social-import social-thread social-notifications search
#          keybindings keymap keymap:<system>:<layer> (such as keymap:macos:cmd-shift) settings-file data-usage, open:<file>, read-only:<file>.canvas, convert:<file>.canvas
#   steps  --keys: steps joined by | (src/script.rs lists them: text, key, click, rclick, drag,
#          hover, waitfor, ...); a target is x,y in window points or @label (a text drawn there)
#   vault  a folder below docs/screenshots/ used (as a copy) instead of the made-up demo vault
#   env    VAR=value words for the run (SHALE_VIM=1 turns vim-lite on, SHALE_THEME=Catppuccin_Latte picks
#          a theme, `_` for a space); {fixtures} is the fixtures folder.
#          A found TeX: SHALE_FAKE_DATA_DIR={fixtures}/fake-tex/data PATH={fixtures}/fake-tex/path:/usr/bin:/bin
#          (a pretend TeX Live and an xdg-open that opens nothing, TEX-034)
#          SHALE_DEMO_HISTORY=<folder> makes a history of the made-up vault from the folders v1, v2, ... of <folder>
#          (v3-sync-laptop: a version synced from a device called laptop), an hour apart, the last one an hour before the clock (HIST-018)
#          SHALE_DEMO_BUSY=1 starts two made-up background tasks, so the indicator at the top right of the pane shows (JOB-014)
#   docs   the documents that show the picture (a test checks that each one does)


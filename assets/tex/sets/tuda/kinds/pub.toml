# TU Darmstadt, publication: papers and short documents. The title is the note's title; the writer
# maps the headings by nesting: # to \section, ## to \subsection, ### to \subsubsection (mapping
# "article"). See the README of the set for every key.
name = "Publication"
description = "Papers and short documents (class tudapub)"
mapping = "article"
class = "tudapub"
before_class = ["\\RequirePackage{pdfmanagement}", "\\SetKeys[document/metadata]{pdfstandard=a-2b,pdfversion=1.7,lang={lang}}"]
options = ["{language}", "accentcolor={accent}"]
preamble = ["\\usepackage[{language}]{babel}", "\\usepackage[autostyle]{csquotes}"]
logo = true

[[fields]]
key = "title"
label = "Title"
command = "title"
required = true

[[fields]]
key = "subtitle"
label = "Subtitle"
command = "subtitle"

[[fields]]
key = "author"
label = "Author"
command = "author"
required = true

[[fields]]
key = "date"
label = "Date"
command = "date"

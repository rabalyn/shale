# TU Darmstadt, scientific poster (class tudasciposter, boxes of tcolorbox's poster library).
# The writer puts every heading of the shallowest level of the note (# or ##) into a posterboxenv
# of a tcbposter, in two columns (mapping "poster", and a class named *sciposter).
# The department logo (Settings → LaTeX) is the class's \titlegraphic: under the TU logo, right-aligned.
name = "Scientific poster"
description = "Scientific posters with boxes (class tudasciposter)"
mapping = "poster"
class = "tudasciposter"
options = ["{language}", "accentcolor={accent}"]
preamble = ["\\usepackage[{language}]{babel}", "\\usepackage[autostyle]{csquotes}"]
logo = true
department_logo = ["\\ExplSyntaxOn", "\\titlegraphic{\\includegraphics[height=\\c_ptxcd_logoheight_dim]{{department_logo}}}", "\\ExplSyntaxOff"]

[[fields]]
key = "title"
label = "Title"
command = "title"
required = true

[[fields]]
key = "subtitle"
label = "Subtitle"
command = "subtitle"

[[fields]]
key = "author"
label = "Author"
command = "author"
required = true

[[fields]]
key = "institute"
label = "Institute"
command = "institute"

[[fields]]
key = "footer"
label = "Footer text"
command = "footer"

# TU Darmstadt, letter (class tudaletter, KOMA-Script's scrlttr2). The recipient is the argument of
# the letter environment; the fields with a komavar are set with \setkomavar{name}{value}
# (mapping "letter"): headings are bold lines. The subject is the note's name when the note gives
# none. The sender's address data can be put in an .lco file in tex/.
# The department logo (Settings → LaTeX) goes into the letter head (firsthead), 5 mm under the TU logo,
# right-aligned, on the first page.
name = "Letter"
description = "Letters (class tudaletter)"
mapping = "letter"
class = "tudaletter"
before_class = ["\\RequirePackage{pdfmanagement}", "\\SetKeys[document/metadata]{pdfstandard=a-2b,pdfversion=1.7,lang={lang}}"]
options = ["{language}", "accentcolor={accent}", "premium=true"]
preamble = ["\\usepackage[{language}]{babel}", "\\usepackage[autostyle]{csquotes}"]
logo = true
department_logo = ["\\ExplSyntaxOn", "\\setkomavar{firsthead}{\\raisebox{0pt}[\\height][0pt]{\\parbox[t]{\\useplength{firstheadwidth}}{\\raggedleft\\smash{\\ptxcd_LetterheadRule}\\par\\vspace{.5\\c_ptxcd_logoheight_dim}\\makebox[\\__ptxcd_logowidth:][l]{\\__ptxcd_insert_logo:}\\par\\vspace{5mm}\\includegraphics[height=\\c_ptxcd_logoheight_dim]{{department_logo}}}}}", "\\ExplSyntaxOff"]

[[fields]]
key = "recipient"
label = "Recipient (lines separated by \\\\)"
required = true

[[fields]]
key = "subject"
label = "Subject"
komavar = "subject"
required = true

[[fields]]
key = "sender"
label = "Sender"
komavar = "fromname"

[[fields]]
key = "sender_address"
label = "Sender's address"
komavar = "fromaddress"

[[fields]]
key = "date"
label = "Date"
komavar = "date"

[[fields]]
key = "opening"
label = "Opening"
default = "Dear Sir or Madam,"

[[fields]]
key = "closing"
label = "Closing"
default = "Kind regards"

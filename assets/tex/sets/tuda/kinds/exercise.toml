# TU Darmstadt, exercise sheet (class tudaexercise): a sheet with a term and a sheet number.
name = "Exercise sheet"
description = "Exercise sheets (class tudaexercise)"
mapping = "article"
class = "tudaexercise"
options = ["{language}", "accentcolor={accent}"]
preamble = ["\\usepackage[{language}]{babel}", "\\usepackage[autostyle]{csquotes}"]
logo = true

[[fields]]
key = "title"
label = "Title"
command = "title"
required = true

[[fields]]
key = "subtitle"
label = "Subtitle"
command = "subtitle"

[[fields]]
key = "author"
label = "Author"
command = "author"
required = true

[[fields]]
key = "term"
label = "Term"
command = "term"
default = "Winter term"

[[fields]]
key = "sheet"
label = "Sheet number"
command = "sheetnumber"
default = "1"

[[fields]]
key = "date"
label = "Date"
command = "date"

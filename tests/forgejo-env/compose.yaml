name: shale-forgejo-env

services:
  # a real Forgejo on SQLite: no outside network, no registration, no mail, the Actions of the server recipe (SITE-049, runner/); its built-in SSH server
  # listens on 127.0.0.1:13022 only (SYNC-081)
  forgejo:
    image: codeberg.org/forgejo/forgejo:11.0.16-rootless
    ports:
      - "127.0.0.1:13000:3000"
      - "127.0.0.1:13022:2222"
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__ROOT_URL: http://127.0.0.1:13000/
      FORGEJO__server__DISABLE_SSH: "false"
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__server__SSH_DOMAIN: 127.0.0.1
      FORGEJO__server__SSH_PORT: "13022"
      FORGEJO__server__SSH_LISTEN_HOST: 0.0.0.0
      FORGEJO__server__SSH_LISTEN_PORT: "2222"
      # the LFS store the publish uploads media to (SITE-069); the secret is a throw-away value of this test server
      FORGEJO__server__LFS_START_SERVER: "true"
      FORGEJO__server__LFS_JWT_SECRET: "shale-test-lfs-secret-not-for-use-anywhere0"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__mailer__ENABLED: "false"
      FORGEJO__log__LEVEL: Warn
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"
    volumes:
      - forgejodata:/var/lib/gitea
      - forgejoconf:/etc/gitea

volumes:
  forgejodata:
    name: shale-forgejo-env-data
  forgejoconf:
    name: shale-forgejo-env-conf

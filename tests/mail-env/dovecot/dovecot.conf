# Dovecot 2.4 for Shale's mail test environment. Two users:
#   alice@shale.test  signs in with a password (PLAIN)
#   oauth@shale.test  signs in with an OAuth2 token (XOAUTH2 / OAUTHBEARER), checked by
#                     introspection against the pretend provider in the "oauth" container
dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.0

base_dir = /run/dovecot
state_dir = /run/dovecot
log_path = /dev/stdout
protocols = imap submission
default_internal_user = vmail
default_login_user = vmail
default_internal_group = vmail

# Mail: one maildir per user in the volume, folders as directories with "/" between levels.
mail_driver = maildir
mail_home = /srv/vmail/%{user}
mail_path = ~/mail
mail_uid = vmail
mail_gid = vmail
mailbox_list_layout = fs
mailbox_list_utf8 = yes
mail_utf8_extensions = yes

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
  mailbox Junk {
    special_use = \Junk
  }
}

# TLS: the certificate comes from tests/mail-env/certs (made by setup-certs.sh)
ssl = required
ssl_server {
  cert_file = /certs/tls.crt
  key_file = /certs/tls.key
}

# IMAPS on 31993, IMAP + STARTTLS on 31143 (the compose file publishes them on 127.0.0.1)
# "chroot =" (empty): the image runs Dovecot as the unprivileged user vmail and relies on file
# capabilities for the login processes to chroot. Where the container inherits NoNewPrivs (a parent
# process has it set, as in sandboxed dev tools), the kernel ignores file capabilities, so the chroot
# fails ("chroot(/run/dovecot/login) failed: Operation not permitted") and every connection is
# closed (#592). Without the chroot the login processes work the same; it is only a test stack.
service imap-login {
  chroot =
  inet_listener imap {
    port = 31143
  }
  inet_listener imaps {
    port = 31993
    ssl = yes
  }
}

# Sending (phase 3): the submission service signs people in like IMAP does (the same passdbs below, so
# the password user and the OAuth2 user both work) and relays what they send to the sink in the
# "mailpit" container, which shares this network: Shale's tests read what arrived from its API.
# SMTP over TLS on 31465, SMTP with STARTTLS on 31587 (published on 10465 and 10587).
hostname = shale.test
postmaster_address = postmaster@shale.test
submission_relay_host = localhost
submission_relay_port = 1025
submission_relay_ssl = no
submission_relay_trusted = yes

# no chroot here either (see imap-login above)
service submission-login {
  chroot =
  inet_listener submission {
    port = 31587
  }
  inet_listener submissions {
    port = 31465
    ssl = yes
  }
}

# Both mechanisms of OAuth2, and PLAIN for the password user. Dovecot offers PLAIN only
# after TLS (ssl = required) so no password goes out unencrypted.
auth_mechanisms = plain xoauth2 oauthbearer

passdb passwd-file {
  driver = passwd-file
  passwd_file_path = /etc/dovecot/users
  default_password_scheme = PLAIN
  mechanisms_filter = plain login
}

# Every sign-in asks the provider about the token: Dovecot sends it as a Bearer token to the
# provider's userinfo endpoint (introspection_mode = auth) and takes the user from `sub`. A token
# the provider does not know (revoked, or from before the provider restarted) is refused.
oauth2 {
  introspection_url = http://localhost:18080/default/userinfo
  introspection_mode = auth
  force_introspection = yes
  username_attribute = sub
}

passdb oauth2 {
  driver = oauth2
  mechanisms_filter = xoauth2 oauthbearer
}

userdb static {
  fields {
    home = /srv/vmail/%{user}
  }
  allow_all_users = yes
}

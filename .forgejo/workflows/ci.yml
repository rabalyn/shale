# Day-to-day CI on the homelab Forgejo (git remote `origin`): every push and pull
# request is formatted, linted, built, tested and packaged here, and the dependencies are audited.
# Nothing is published from here. Releases are built and published by GitHub from `v*` tags
# (.github/workflows/build.yml; Forgejo ignores .github/workflows because this folder exists).
#
# The runner starts the job in a container (Docker or Podman). Steps are plain shell: JavaScript
# actions (checkout, cache, upload-artifact) need Node, which the Rust image does not have, and
# copying them into the container fails under Podman's Docker API.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  # weekly, so advisories published for unchanged code are noticed (only the audit job runs then)
  schedule:
    - cron: '17 5 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # the scheduled run is only for the audit below
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # same compiler as rust-toolchain.toml (rustup in the image reads it and agrees)
    container:
      image: docker.io/library/rust:1.100.0-bookworm
    env:
      # always strict: any warning (also in vendored crates) fails the build
      RUSTFLAGS: -D warnings
    steps:
      # A self-hosted runner may mount an extra CA certificate (the private CA in front of
      # Forgejo) at this path; add it so git trusts it without losing the public CAs.
      - name: Trust the runner's extra CA, if any
        run: |
          if [ -f /usr/local/share/ca-certificates/runner-extra-ca.crt ]; then
            update-ca-certificates >/dev/null 2>&1
            echo "Added the runner's extra CA."
          fi

      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -f Cargo.toml ]; then
            echo "Workspace already populated (local act_runner exec)."
          else
            git init -q .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            auth=()
            if [ -n "$TOKEN" ]; then
              auth=(-c "http.extraHeader=Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)")
            fi
            git "${auth[@]}" fetch -q --depth=1 origin "${{ github.sha }}"
            git checkout -q FETCH_HEAD
          fi
          git log -1 --oneline 2>/dev/null || true

      # The checkout above is shallow and has no tags; the release check and the commit check
      # need the history and the tags (the token is only needed when the repository is private).
      - name: Fetch the history and the tags (tags, main and pull requests)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=()
          if [ -n "$TOKEN" ]; then
            auth=(-c "http.extraHeader=Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)")
          fi
          git "${auth[@]}" fetch -q --tags --force origin
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git "${auth[@]}" fetch -q --unshallow origin
          fi
          # the commits a pull request or push is compared with may be outside the fetched history
          for sha in "${{ github.event.pull_request.base.sha }}" "${{ github.event.before }}"; do
            if [ -n "$sha" ]; then git "${auth[@]}" fetch -q origin "$sha" || true; fi
          done

      # BUILD-013: valid semver, greater than the previous tag, Cargo.toml and Cargo.lock agree,
      # and the CHANGELOG.md section is not empty and names every issue closed since the previous tag
      - name: Check the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh .github/check-release.sh "${GITHUB_REF_NAME#v}"

      # FORGE-008: every new commit names an issue or starts with "no-issue:"
      - name: Check that commits name an issue (main and pull requests)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            sh .forgejo/scripts/check-commit-issues.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            sh .forgejo/scripts/check-commit-issues.sh "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Test the release and commit checks
        run: |
          sh .github/test-check-release.sh
          sh .forgejo/scripts/test-check-commit-issues.sh

      - name: Libraries for the window (Wayland, X11, OpenGL)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl-dev libegl-dev >/dev/null

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          cargo --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      # the same package and checksum as the GitHub release build, checked here so a broken
      # packaging step shows up before a release tag
      - name: Package and check the checksum
        shell: bash
        run: |
          mkdir -p dist/shale
          cp target/release/shale LICENSE README.md CHANGELOG.md dist/shale/
          cp -r docs dist/shale/
          tar -C dist -czf shale-linux-x86_64.tar.gz shale
          sha256sum shale-linux-x86_64.tar.gz > shale-linux-x86_64.tar.gz.sha256
          cat shale-linux-x86_64.tar.gz.sha256
          sha256sum -c shale-linux-x86_64.tar.gz.sha256
          tar -tzf shale-linux-x86_64.tar.gz shale/shale >/dev/null

  # separate from the build, so an advisory published overnight shows up as a red job of its own
  # but never blocks the build
  audit:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/rust:1.100.0-bookworm
    steps:
      - name: Trust the runner's extra CA, if any
        run: |
          if [ -f /usr/local/share/ca-certificates/runner-extra-ca.crt ]; then
            update-ca-certificates >/dev/null 2>&1
            echo "Added the runner's extra CA."
          fi

      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -f Cargo.toml ]; then
            echo "Workspace already populated (local act_runner exec)."
          else
            git init -q .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            auth=()
            if [ -n "$TOKEN" ]; then
              auth=(-c "http.extraHeader=Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)")
            fi
            git "${auth[@]}" fetch -q --depth=1 origin "${{ github.sha }}"
            git checkout -q FETCH_HEAD
          fi

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # reads only Cargo.lock, so it needs no build and no system libraries
      - name: Audit the dependencies
        run: cargo audit

  # DEV-003: line coverage of the unit tests (`cargo llvm-cov`), the summary per file in the log and
  # a ratchet against .forgejo/coverage-baseline. Separate from the build, so it never blocks it.
  # No artifact is uploaded (upload-artifact is a JavaScript action); the table in the log is the
  # report, and `cargo llvm-cov --html` makes the browsable one locally (docs/coverage.md).
  coverage:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/rust:1.100.0-bookworm
    steps:
      - name: Trust the runner's extra CA, if any
        run: |
          if [ -f /usr/local/share/ca-certificates/runner-extra-ca.crt ]; then
            update-ca-certificates >/dev/null 2>&1
            echo "Added the runner's extra CA."
          fi

      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -f Cargo.toml ]; then
            echo "Workspace already populated (local act_runner exec)."
          else
            git init -q .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            auth=()
            if [ -n "$TOKEN" ]; then
              auth=(-c "http.extraHeader=Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)")
            fi
            git "${auth[@]}" fetch -q --depth=1 origin "${{ github.sha }}"
            git checkout -q FETCH_HEAD
          fi

      - name: Libraries for the window (Wayland, X11, OpenGL)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl-dev libegl-dev >/dev/null

      - name: Install cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Test the coverage check
        run: sh .forgejo/scripts/test-check-coverage.sh

      - name: Measure the coverage
        run: |
          cargo llvm-cov --locked --lcov --output-path lcov.info
          cargo llvm-cov report

      - name: Check the coverage against the baseline
        run: sh .forgejo/scripts/check-coverage.sh lcov.info .forgejo/coverage-baseline

  # DEV-011, CALENV-004, MAIL-093: the real-server suites (Radicale, Dovecot, the OAuth2 provider and
  # Mailpit in containers) of tests/caldav-env and tests/mail-env. Needs a container engine inside the
  # job container; where the runner offers none, the job says so and ends green without running the
  # suites (see tests/caldav-env/README.md, "In CI"). Separate from the build, so it never blocks it.
  env-tests:
    if: github.event_name != 'workflow_dispatch' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/rust:1.100.0-bookworm
    steps:
      - name: Trust the runner's extra CA, if any
        run: |
          if [ -f /usr/local/share/ca-certificates/runner-extra-ca.crt ]; then
            update-ca-certificates >/dev/null 2>&1
            echo "Added the runner's extra CA."
          fi

      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -f Cargo.toml ]; then
            echo "Workspace already populated (local act_runner exec)."
          else
            git init -q .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            auth=()
            if [ -n "$TOKEN" ]; then
              auth=(-c "http.extraHeader=Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)")
            fi
            git "${auth[@]}" fetch -q --depth=1 origin "${{ github.sha }}"
            git checkout -q FETCH_HEAD
          fi

      # a pull request runs the suites only when it touches the code or the environments
      - name: Decide whether this run is wanted
        id: wanted
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          answer=yes
          if [ "${{ github.event_name }}" = pull_request ]; then
            auth=()
            if [ -n "$TOKEN" ]; then
              auth=(-c "http.extraHeader=Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)")
            fi
            git "${auth[@]}" fetch -q --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            answer=$(sh .forgejo/scripts/env-tests.sh wanted pull_request "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          fi
          echo "wanted=$answer" >> "$GITHUB_OUTPUT"
          if [ "$answer" = no ]; then echo "This pull request touches neither the CalDAV/mail code nor the test environments: skipped."; fi

      # best effort: where the container may not install packages or has no privileges, the next
      # step finds no engine and skips
      - name: Container engine (Podman)
        if: steps.wanted.outputs.wanted == 'yes'
        run: |
          (apt-get update -qq && apt-get install -y -qq --no-install-recommends podman podman-compose openssl curl netcat-openbsd >/dev/null) \
            || echo "Could not install Podman here."

      - name: Detect whether containers can run here
        id: engine
        if: steps.wanted.outputs.wanted == 'yes'
        run: |
          engine=$(sh .forgejo/scripts/env-tests.sh detect)
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          if [ "$engine" = none ]; then
            echo "SKIPPED: this runner cannot run containers inside the job container (neither 'podman info' nor 'docker info' works)."
            echo "The CalDAV and mail real-server tests did NOT run. What the runner needs: tests/caldav-env/README.md, section 'In CI'."
          else
            echo "Container engine: $engine"
          fi

      - name: Libraries for the window (Wayland, X11, OpenGL)
        if: steps.engine.outputs.engine == 'podman' || steps.engine.outputs.engine == 'docker'
        run: |
          apt-get install -y -qq --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl-dev libegl-dev >/dev/null

      # starts both stacks, runs both ignored suites and always takes the stacks down again
      - name: CalDAV and mail tests against the real servers
        if: steps.engine.outputs.engine == 'podman' || steps.engine.outputs.engine == 'docker'
        run: sh .forgejo/scripts/env-tests.sh run

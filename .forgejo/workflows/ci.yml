# CI on the homelab Forgejo (git remote `origin`): every `v*` tag is formatted, linted, built,
# tested and packaged here (the dependencies are audited by security.yml, which also turns
# advisories into GitHub issues, BUILD-021). Changes are landed locally by scripts/land.sh, which
# runs the checks before it pushes `main` (FORGE-011, ADR-0016); a push to `main` runs nothing
# here (ADR-0018). The tags are made by script: scripts/make-tag.sh makes a pre-release check tag
# `vX.Y.Z-rc.N` when the owner is done for now (FORGE-013), scripts/make-release.sh a release
# `vX.Y.Z` (FORGE-014). A red run is fixed in a branch and a new tag is made; a pushed tag is
# never moved.
# Nothing is published from here. Releases are built and published by GitHub from release tags
# (.github/workflows/build.yml; Forgejo ignores .github/workflows because this folder exists).
# The commit of a tag that passes the build is pushed to GitHub's `main` (the `mirror` job), so
# the public repository has the code its issues talk about; that push starts GitHub's main-check
# (macOS and Windows tests, which also keep the Rust cache warm, BUILD-039, ADR-0025). A release tag is
# pushed there too (before main), which starts the release build (BUILD-016, BUILD-017).
#
# The runner starts the job in a container (Docker or Podman). Steps are plain shell: JavaScript
# actions (checkout, cache, upload-artifact) need Node, which the Rust image does not have, and
# copying them into the container fails under Podman's Docker API.
name: ci

on:
  # main, branches and pull requests run nothing: scripts/land.sh checks them locally (FORGE-011,
  # ADR-0018); only tags run CI
  push:
    tags: ['v*']
  workflow_dispatch:
  # weekly, so the real-server suites notice changed test images (only env-tests runs then)
  schedule:
    - cron: '17 5 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # the scheduled run is only for env-tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # same compiler as rust-toolchain.toml (rustup in the image reads it and agrees)
    container:
      image: docker.io/library/rust:1.100.0-bookworm
      # kept between runs on the runner's host (allowed in its config.yaml `valid_volumes`):
      # the crates, git dependencies and build folder, so a run compiles only what changed
      volumes:
        - /srv/data/deployments/forgejo-runner/cache/shale/registry:/usr/local/cargo/registry
        - /srv/data/deployments/forgejo-runner/cache/shale/git:/usr/local/cargo/git
        - /srv/data/deployments/forgejo-runner/cache/shale/target:/cache/target
    env:
      # always strict: any warning (also in vendored crates) fails the build
      RUSTFLAGS: -D warnings
      CARGO_TARGET_DIR: /cache/target
    steps:
      # A self-hosted runner may mount an extra CA certificate (the private CA in front of
      # Forgejo) at this path; add it so git trusts it without losing the public CAs.
      - name: Trust the runner's extra CA, if any
        run: |
          if [ -f /usr/local/share/ca-certificates/runner-extra-ca.crt ]; then
            update-ca-certificates >/dev/null 2>&1
            echo "Added the runner's extra CA."
          fi

      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -f Cargo.toml ]; then
            echo "Workspace already populated (local act_runner exec)."
          else
            git init -q .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            # the token goes in git's environment, never on its command line (argv shows in the process list)
            git_auth() {
              if [ -n "$TOKEN" ]; then
                GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
                  GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" git "$@"
              else
                git "$@"
              fi
            }
            git_auth fetch -q --depth=1 origin "${{ github.sha }}"
            git checkout -q FETCH_HEAD
          fi
          git log -1 --oneline 2>/dev/null || true

      # The checkout above is shallow and has no tags; the release check and the commit check
      # need the history and the tags (the token is only needed when the repository is private).
      - name: Fetch the history and the tags (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          # the token goes in git's environment, never on its command line (argv shows in the process list)
          git_auth() {
            if [ -n "$TOKEN" ]; then
              GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
                GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" git "$@"
            else
              git "$@"
            fi
          }
          git_auth fetch -q --tags --force origin
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git_auth fetch -q --unshallow origin
          fi

      # BUILD-013: valid semver, greater than the previous tag, Cargo.toml and Cargo.lock agree,
      # and the CHANGELOG.md section is not empty and names every issue closed since the previous tag
      - name: Check the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # the last release with a page on GitHub (none yet: unset): the notes GitHub publishes
          # cover every version since it, and Forgejo's tags can be ahead of it (no jq here yet)
          if ! body=$(curl -fsS https://api.github.com/repos/rabalyn/shale/releases/latest 2>&1); then
            if printf '%s' "$body" | grep -q '404'; then
              body=""
            else
              echo "error: could not look up the last published release on GitHub: $body" >&2
              exit 1
            fi
          fi
          SHALE_PREV_PUBLISHED=$(printf '%s' "$body" | sed -n 's/^ *"tag_name": *"\([^"]*\)".*/\1/p' | head -n 1)
          export SHALE_PREV_PUBLISHED
          echo "last published release: ${SHALE_PREV_PUBLISHED:-none}"
          sh .github/check-release.sh "${GITHUB_REF_NAME#v}"

      # jq: the test of scripts/report-advisories.sh runs the script (BUILD-021), and the release script
      # tests (scripts/test-release.sh) filter JSON with it, so this runs before them (#522)
      - name: Libraries for the window (Wayland, X11, OpenGL) and jq
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl-dev libegl-dev jq git-lfs ffmpeg >/dev/null

      - name: Test the release and commit checks
        run: |
          sh .github/test-check-release.sh
          sh .forgejo/scripts/test-check-commit-issues.sh
          sh .forgejo/scripts/test-check-property-rules.sh
          bash scripts/test-land.sh
          bash scripts/test-env-tests.sh
          bash scripts/test-bench-wanted.sh
          bash scripts/test-dev-metrics.sh
          bash scripts/test-release.sh

      # BUILD-015: the README and every release page start with the AI-development notice
      - name: Check the AI notice
        run: |
          sh .github/check-ai-notice.sh
          sh .github/test-check-ai-notice.sh

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          cargo --version

      # the kept build folder grows with every dependency update; start it afresh past 20 GB
      - name: Keep the build cache in bounds
        run: |
          used=$(du -sm "$CARGO_TARGET_DIR" | cut -f1)
          echo "build cache: ${used} MB"
          if [ "$used" -gt 20480 ]; then
            find "$CARGO_TARGET_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            echo "emptied it"
          fi

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      # the same package and checksum as the GitHub release build, checked here so a broken
      # packaging step shows up before a release tag
      - name: Package and check the checksum
        shell: bash
        run: |
          mkdir -p dist/shale
          cp "$CARGO_TARGET_DIR/release/shale" LICENSE README.md CHANGELOG.md dist/shale/
          cp assets/icon/shale.desktop assets/icon/shale.svg scripts/install.sh dist/shale/
          # BUILD-025: install.sh puts the icon sizes in the hicolor theme
          mkdir -p dist/shale/assets/icon
          cp assets/icon/shale-*.png dist/shale/assets/icon/
          cp -r docs dist/shale/
          # DEV-020: the guide is in the archive once, as docs/userguide (FEATURES.md links into it),
          # without what Shale writes into a vault; and as a zip of its own
          rm -rf dist/shale/docs/userguide
          scripts/userguide-dist.sh dist/shale/docs/userguide
          tar -C dist -czf shale-linux-x86_64.tar.gz shale
          sha256sum shale-linux-x86_64.tar.gz > shale-linux-x86_64.tar.gz.sha256
          cat shale-linux-x86_64.tar.gz.sha256
          sha256sum -c shale-linux-x86_64.tar.gz.sha256
          tar -tzf shale-linux-x86_64.tar.gz shale/shale >/dev/null
          tar -tzf shale-linux-x86_64.tar.gz "shale/docs/userguide/Start here.md" >/dev/null
          command -v zip >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends zip unzip >/dev/null)
          scripts/userguide-dist.sh dist/zip/userguide
          (cd dist/zip && zip -qr ../../shale-userguide.zip userguide)
          sha256sum shale-userguide.zip > shale-userguide.zip.sha256
          sha256sum -c shale-userguide.zip.sha256
          unzip -tq shale-userguide.zip
          # BUILD-023: the guide as one PDF, a book (BOOK-011), made by this release build without a window
          SHALE="$CARGO_TARGET_DIR/release/shale" scripts/userguide-pdf.sh shale-userguide.pdf
          test "$(head -c 4 shale-userguide.pdf)" = "%PDF"
          sha256sum shale-userguide.pdf > shale-userguide.pdf.sha256
          sha256sum -c shale-userguide.pdf.sha256

  # separate from the build, so an advisory published overnight shows up as a red job of its own
  # but never blocks the build
  # DEV-002: a dependency that no code uses fails the build (vendor/ is skipped via .ignore)
  unused-deps:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/rust:1.100.0-bookworm
      volumes:
        - /srv/data/deployments/forgejo-runner/cache/shale/registry:/usr/local/cargo/registry
        - /srv/data/deployments/forgejo-runner/cache/shale/tools:/cache/tools
    steps:
      - name: Trust the runner's extra CA, if any
        run: |
          if [ -f /usr/local/share/ca-certificates/runner-extra-ca.crt ]; then
            update-ca-certificates >/dev/null 2>&1
            echo "Added the runner's extra CA."
          fi

      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -f Cargo.toml ]; then
            echo "Workspace already populated (local act_runner exec)."
          else
            git init -q .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            # the token goes in git's environment, never on its command line (argv shows in the process list)
            git_auth() {
              if [ -n "$TOKEN" ]; then
                GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
                  GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" git "$@"
              else
                git "$@"
              fi
            }
            git_auth fetch -q --depth=1 origin "${{ github.sha }}"
            git checkout -q FETCH_HEAD
          fi

      - name: Install cargo-machete
        # kept between runs in /cache/tools: installed again only when the version changes
        run: |
          cargo install cargo-machete --version 0.9.2 --locked --root /cache/tools
          echo /cache/tools/bin >> "$GITHUB_PATH"

      # reads only the sources and Cargo.toml, so it needs no build and no system libraries
      - name: Check for unused dependencies
        run: cargo machete

  # DEV-003: line coverage of the unit tests (`cargo llvm-cov`), the summary per file in the log and
  # a ratchet against .forgejo/coverage-baseline. Separate from the build, so it never blocks it.
  # No artifact is uploaded (upload-artifact is a JavaScript action); the table in the log is the
  # report, and `cargo llvm-cov --html` makes the browsable one locally (docs/coverage.md).
  # Runs for every tag, check and release: `mirror` needs it (#461, ADR-0026), so a skipped
  # coverage would skip the mirror of every release. Not for the weekly run or a run by hand.
  coverage:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/rust:1.100.0-bookworm
      volumes:
        - /srv/data/deployments/forgejo-runner/cache/shale/registry:/usr/local/cargo/registry
        - /srv/data/deployments/forgejo-runner/cache/shale/git:/usr/local/cargo/git
        - /srv/data/deployments/forgejo-runner/cache/shale/tools:/cache/tools
        - /srv/data/deployments/forgejo-runner/cache/shale/target-cov:/cache/target-cov
    env:
      CARGO_TARGET_DIR: /cache/target-cov
    steps:
      - name: Trust the runner's extra CA, if any
        run: |
          if [ -f /usr/local/share/ca-certificates/runner-extra-ca.crt ]; then
            update-ca-certificates >/dev/null 2>&1
            echo "Added the runner's extra CA."
          fi

      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -f Cargo.toml ]; then
            echo "Workspace already populated (local act_runner exec)."
          else
            git init -q .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            # the token goes in git's environment, never on its command line (argv shows in the process list)
            git_auth() {
              if [ -n "$TOKEN" ]; then
                GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
                  GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" git "$@"
              else
                git "$@"
              fi
            }
            git_auth fetch -q --depth=1 origin "${{ github.sha }}"
            git checkout -q FETCH_HEAD
          fi

      # jq: the test of scripts/report-advisories.sh runs the script (BUILD-021)
      - name: Libraries for the window (Wayland, X11, OpenGL) and jq
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl-dev libegl-dev jq git-lfs ffmpeg >/dev/null

      - name: Install cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked --root /cache/tools
          echo /cache/tools/bin >> "$GITHUB_PATH"

      - name: Test the coverage check
        run: sh .forgejo/scripts/test-check-coverage.sh

      - name: Measure the coverage
        run: |
          cargo llvm-cov --locked --lcov --output-path lcov.info
          cargo llvm-cov report

      - name: Check the coverage against the baseline
        run: sh .forgejo/scripts/check-coverage.sh lcov.info .forgejo/coverage-baseline

  # DEV-011, CALENV-004, MAIL-093, TEX-020: the real-server suites (Radicale, Dovecot, the OAuth2 provider and
  # Mailpit in containers) of tests/caldav-env and tests/mail-env, the sync wizard against a real Forgejo (tests/forgejo-env, SYNC-066) and the LuaLaTeX suite of tests/tex-env. Needs a container engine inside the
  # job container; where the runner offers none, the job says so and ends green without running the
  # suites (see tests/caldav-env/README.md, "In CI"). Separate from the build, so it never blocks it.
  env-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/rust:1.100.0-bookworm
      volumes:
        - /srv/data/deployments/forgejo-runner/cache/shale/registry:/usr/local/cargo/registry
        - /srv/data/deployments/forgejo-runner/cache/shale/git:/usr/local/cargo/git
        - /srv/data/deployments/forgejo-runner/cache/shale/target-env:/cache/target-env
        # podman's image storage, kept between runs (ADR-0022): a tag run reuses the TeX image and the
        # CalDAV and mail images instead of building and pulling them again
        - /srv/data/deployments/forgejo-runner/cache/shale/containers:/var/lib/containers
    env:
      CARGO_TARGET_DIR: /cache/target-env
    steps:
      - name: Trust the runner's extra CA, if any
        run: |
          if [ -f /usr/local/share/ca-certificates/runner-extra-ca.crt ]; then
            update-ca-certificates >/dev/null 2>&1
            echo "Added the runner's extra CA."
          fi

      - name: Check out
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ -f Cargo.toml ]; then
            echo "Workspace already populated (local act_runner exec)."
          else
            git init -q .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            # the token goes in git's environment, never on its command line (argv shows in the process list)
            git_auth() {
              if [ -n "$TOKEN" ]; then
                GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
                  GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" git "$@"
              else
                git "$@"
              fi
            }
            git_auth fetch -q --depth=1 origin "${{ github.sha }}"
            git checkout -q FETCH_HEAD
          fi

      # best effort: where the container may not install packages or has no privileges, the next
      # step finds no engine and skips
      - name: Container engine (Podman)
        run: |
          (apt-get update -qq && apt-get install -y -qq --no-install-recommends podman python3-pip openssl curl netcat-openbsd util-linux >/dev/null) \
            || echo "Could not install Podman here."
          # bookworm's podman-compose (1.0.3) does not know `network_mode: "service:…"`, which the mail
          # stack uses: a pinned newer one from PyPI
          # where Podman could not be installed the next steps skip; where it is there, the stack needs
          # podman-compose, so a PyPI that does not answer is retried and then fails the step with its reason
          if command -v podman >/dev/null 2>&1; then
            installed=no
            for attempt in 1 2 3; do
              if python3 -m pip install -q --break-system-packages podman-compose==1.2.0; then
                installed=yes
                break
              fi
              echo "Installing podman-compose failed (attempt $attempt of 3)."
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 10))
              fi
            done
            if [ "$installed" != yes ]; then
              echo "::error::podman-compose 1.2.0 could not be installed from PyPI after 3 attempts; the mail stack needs it (network_mode service:...), so the env-tests cannot run"
              exit 1
            fi
          fi
          # podman's default `overlay` storage does not work on top of the job container's own overlayfs
          # ("'overlay' is not supported over overlayfs"): vfs is slower but works; set before podman's first run.
          # graphroot is on the runner volume above (ADR-0022), so keep the driver: a different one cannot read it
          mkdir -p /etc/containers
          printf '[storage]\ndriver = "vfs"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' > /etc/containers/storage.conf

      - name: Detect whether containers can run here
        id: engine
        run: |
          engine=$(sh .forgejo/scripts/env-tests.sh detect)
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          if [ "$engine" = none ]; then
            echo "SKIPPED: this runner cannot run containers inside the job container (podman and docker cannot start a container here; the reason is above)."
            echo "The CalDAV, mail, Forgejo and TeX real-server tests did NOT run. What the runner needs: tests/caldav-env/README.md, section 'In CI'."
          else
            echo "Container engine: $engine"
          fi

      - name: Libraries for the window (Wayland, X11, OpenGL)
        if: steps.engine.outputs.engine == 'podman' || steps.engine.outputs.engine == 'docker'
        run: |
          apt-get install -y -qq --no-install-recommends pkg-config libasound2-dev libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl-dev libegl-dev >/dev/null

      # starts both stacks, runs both ignored suites and always takes the stacks down again
      - name: CalDAV, mail and TeX tests against the real servers
        if: steps.engine.outputs.engine == 'podman' || steps.engine.outputs.engine == 'docker'
        env:
          # The weekly run and release tags (vX.Y.Z) run the real install and the template downloads;
          # check tags (vX.Y.Z-rc.N) do not (ADR-0021, #325). Only the weekly run builds the TeX image
          # again without the cache; every tag uses the image as built (ADR-0026, #455).
          # The real install of TeX Live (about 100 MB, minutes):
          SHALE_ENV_TESTS_TEX_INSTALL: ${{ (github.event_name == 'schedule' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))) && 'yes' || 'no' }}
          # the template import from GitHub and CTAN (a few MB), which also shows when CTAN's tuda-ci stops fitting the kinds:
          SHALE_ENV_TESTS_TEX_IMPORT: ${{ (github.event_name == 'schedule' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))) && 'yes' || 'no' }}
          # and the TeX image built again from the current TeX Live, so upstream breakage shows up within a week (ADR-0020, ADR-0026); only the weekly run:
          SHALE_ENV_TESTS_TEX_REFRESH: ${{ github.event_name == 'schedule' && 'yes' || 'no' }}
        run: |
          # Tags (release and check) take TeX Live from the homelab mirror next to the runner, as the public
          # CTAN mirror answers the runner with 403 (#424); the address is the repository variable
          # SHALE_TEX_MIRROR, never committed. The weekly run keeps the public default (DEV-011, DEV-025).
          mirror="${{ startsWith(github.ref, 'refs/tags/v') && github.event_name != 'schedule' && vars.SHALE_TEX_MIRROR || '' }}"
          mirror="${mirror%/}"
          case "$mirror" in
            '')
              echo "TeX Live: the default public repository (weekly run, or no vars.SHALE_TEX_MIRROR)" ;;
            https://*|http://*)
              SHALE_TEX_ENV_REPOSITORY=$mirror
              SHALE_TEX_INSTALL_REPOSITORY=$mirror
              export SHALE_TEX_ENV_REPOSITORY SHALE_TEX_INSTALL_REPOSITORY
              echo "TeX Live: the homelab mirror (vars.SHALE_TEX_MIRROR)" ;;
            *)
              echo "vars.SHALE_TEX_MIRROR must start with https:// or http://" >&2
              exit 2 ;;
          esac
          sh .forgejo/scripts/env-tests.sh run "${{ steps.engine.outputs.engine }}"

      # the storage is kept between runs (ADR-0022): drop the images nothing is tagged as any more (the
      # TeX image a --refresh replaced, older test images), so it does not grow run by run
      - name: Prune unused images
        if: always() && (steps.engine.outputs.engine == 'podman' || steps.engine.outputs.engine == 'docker')
        run: |
          ${{ steps.engine.outputs.engine }} image prune -f >/dev/null || true
          ${{ steps.engine.outputs.engine }} system df || true

  # The commit of a tag whose every check job is green (build, unused-deps, coverage, env-tests; a red
  # one, e.g. env-tests, must stop it, and a skipped needed job skips this one too, so each of them
  # must run on a tag push) goes to GitHub's `main` (BUILD-016, FORGE-003): the
  # public repository, where the issues are (ADR-0017), shows the code they refer to; a pushed
  # commit that says `Closes #N` closes that issue there. GitHub runs no workflow for it. A release
  # tag (`vX.Y.Z`, no pre-release part) is pushed after it and starts the release build there
  # (BUILD-012); a pre-release check tag (`vX.Y.Z-rc.N`, FORGE-013) stays here. Only the commit of
  # a tag that is on Forgejo's `main`, never a branch. The write credential is the owner's: a fine-grained GitHub
  # token for rabalyn/shale only, with Contents and Workflows read and write (a deploy key may not
  # push changes to .github/workflows/, raba/shale#52) and Issues read and write (BUILD-021), kept
  # as the Forgejo Actions secret MIRROR_DEPLOY_KEY (the name is from the deploy key it replaced;
  # Forgejo refuses names that start with GITHUB_). Without it the job says so and fails.
  mirror:
    needs: [build, unused-deps, coverage, env-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/rust:1.100.0-bookworm
    steps:
      - name: Trust the runner's extra CA, if any
        run: |
          if [ -f /usr/local/share/ca-certificates/runner-extra-ca.crt ]; then
            update-ca-certificates >/dev/null 2>&1
            echo "Added the runner's extra CA."
          fi

      - name: Push the tag's commit to GitHub's main, and a release tag
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::the secret MIRROR_DEPLOY_KEY (a GitHub token) is not set (see raba/shale#52)"
            exit 1
          fi
          # the whole history of main (a shallow push is refused by GitHub)
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          # the tokens go in git's environment, never on its command line (argv shows in the process list)
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader \
              GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" git "$@"
          }
          git_auth fetch -q origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/$TAG:refs/tags/$TAG"
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          # only a commit of main is sent to GitHub's main
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "::error::the tag $TAG points at $SHA, which is not on Forgejo's main; nothing is pushed"
            exit 1
          fi
          # the token goes in a header (git's environment), never in the remote's address (which git may print)
          git remote add github https://github.com/rabalyn/shale.git
          git_gh() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraHeader \
              GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$MIRROR_TOKEN" | base64 -w0)" git "$@"
          }
          git_gh fetch -q github "+refs/heads/main:refs/remotes/github/main" || true
          # a release tag is pushed BEFORE main: GitHub's workflow main-check.yml, started by the push of
          # main, then finds the tag at its commit and leaves the macOS and Windows tests to the release
          # build, which runs them too (BUILD-039, ADR-0025)
          release=yes
          case "$TAG" in *-*) release=no ;; esac
          push_tag() {
            # GitHub builds and publishes it (BUILD-012); an existing one is never replaced
            there=$(git_gh ls-remote github "refs/tags/$TAG" | cut -f1)
            here=$(git rev-parse "refs/tags/$TAG")
            if [ -n "$there" ]; then
              if [ "$there" = "$here" ]; then
                echo "GitHub already has the tag $TAG."
                return 0
              fi
              echo "::error::GitHub has a different tag $TAG ($there, here $here); nothing is replaced"
              return 1
            fi
            git_gh push github "refs/tags/$TAG:refs/tags/$TAG"
            echo "Pushed the tag $TAG to GitHub: its release build starts there."
          }
          if [ "$release" = yes ]; then
            push_tag
          fi
          # a later tag got there first: main stays (an older commit is never forced over it)
          if git rev-parse -q --verify refs/remotes/github/main >/dev/null && git merge-base --is-ancestor "$SHA" refs/remotes/github/main; then
            echo "GitHub's main already contains $SHA."
          else
            git_gh push github "$SHA:refs/heads/main"
            echo "Pushed $SHA to GitHub's main: its main-check starts there."
          fi
          if [ "$release" = no ]; then
            echo "$TAG is a pre-release (check tag): it stays on Forgejo."
          fi

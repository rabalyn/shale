[package]
name = "shale"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A native Rust notes vault with wiki links, drawings, tasks and a graph"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
hayro = "0.9"
epaint_default_fonts = "0.37"
ttf-parser = "0.25"
miniz_oxide = "0.8"
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# drag and drop from other programs on Wayland (the window toolkit only does it on X11)
winit = "0.30"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

# PDF rendering (hayro) needs crates that are not in the offline build cache;
# their unmodified sources are kept in vendor/ (licences: MIT / Apache-2.0 / BSD-3-Clause).
[patch.crates-io]
brotli = { path = "vendor/brotli-8.0.4" }
fearless_simd_07 = { path = "vendor/fearless_simd-0.7.0", package = "fearless_simd" }
fearless_simd_12 = { path = "vendor/fearless_simd-1.2.0", package = "fearless_simd" }
glifo = { path = "vendor/glifo-0.4.0" }
hayro = { path = "vendor/hayro-0.9.0" }
hayro-ccitt = { path = "vendor/hayro-ccitt-0.5.0" }
hayro-cmap = { path = "vendor/hayro-cmap-0.1.1" }
hayro-font = { path = "vendor/hayro-font-0.5.0" }
hayro-interpret = { path = "vendor/hayro-interpret-0.9.0" }
hayro-jbig2 = { path = "vendor/hayro-jbig2-0.4.0" }
hayro-jpeg2000 = { path = "vendor/hayro-jpeg2000-0.5.0" }
hayro-postscript = { path = "vendor/hayro-postscript-0.2.0" }
hayro-syntax = { path = "vendor/hayro-syntax-0.9.0" }
phf = { path = "vendor/phf-0.13.1" }
phf_generator = { path = "vendor/phf_generator-0.13.1" }
phf_macros = { path = "vendor/phf_macros-0.13.1" }
phf_shared = { path = "vendor/phf_shared-0.13.1" }
pic-scale = { path = "vendor/pic-scale-0.7.12" }
read-fonts = { path = "vendor/read-fonts-0.46.0" }
skrifa = { path = "vendor/skrifa-0.49.0" }
vello_common = { path = "vendor/vello_common-0.3.0" }
vello_cpu = { path = "vendor/vello_cpu-0.3.0" }

[package]
name = "shale"
version = "0.8.0-rc.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A native Rust notes vault with wiki links, drawings, tasks and a graph"

[dependencies]
eframe = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
hayro = "0.9"
epaint_default_fonts = { version = "0.37", features = ["monochrome_emoji_fonts"] }
miniz_oxide = "0.8"
# SHA-256 of a downloaded template archive (TEX-006); already built for rustls
ring = "0.17"
skrifa = "0.49"
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
lettre = { version = "0.11.23", default-features = false, features = ["builder"] }
zeroize = "1.9"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "isomp4", "aac", "alac", "wav", "pcm", "id3v1", "id3v2"] }
cpal = "0.18.2"
rubato = "5.1.0"
# the clipboard's picture when a paste arrives as an <img> tag (EDIT-019); the features egui-winit uses
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
# bat's extra grammars for syntect (TypeScript, TOML, ...; EDIT-032), the set that works with the pure-Rust regex engine
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
toml = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap", "fontconfig"] }
# spans that mark the steps of a flow (DEV-026); no subscriber is installed outside tests, so they cost nothing
tracing = { version = "0.1", default-features = false, features = ["std"] }
# names and paths of links are compared in NFC (NET-014)
unicode-normalization = { version = "0.1", default-features = false }
# the native file dialog of the compose box (SOC-058): the xdg-desktop-portal on Linux (no GTK, and no
# Wayland handle code: the dialog has no parent window), the system dialog on macOS and Windows
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
# the reader of `.bib` files (EDIT-123, ADR-0039 §6); it is the part of Typst's hayagriva that reads BibLaTeX
biblatex = "0.12"
# the formatter of citations and bibliographies with CSL (EDIT-127, ADR-0039 §6): the five named styles and the locales
# come from its archive; it reads entries through the same `biblatex` crate
hayagriva = { version = "0.10", default-features = false, features = ["biblatex", "archive"] }
# the length of a post in graphemes, as Bluesky counts it (SOC-052)
unicode-segmentation = "1"

[features]
# The benchmark harness (BUILD-038): `shale --bench`, scenarios, a counting allocator, comparison and
# report. Off by default, so no shipped build contains any of it.
bench = []

[dev-dependencies]
# the time zone database that Windows builds bundle (below): the tests read it on every system
jiff-tzdb = "1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
# self-signed certificate for the pretend mail server in tests
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
# the names of the symbols in the linker map of the size report (BUILD-045, examples/size_report.rs)
rustc-demangle = "0.1.28"
# the recorder of the dataflow diagrams is a layer of this (DEV-026)
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

# Always strict: CI builds with RUSTFLAGS="-D warnings" and runs clippy with -D warnings.
[lints.rust]
# an unsafe fn body is not automatically an unsafe block: every unsafe call is spelled out
unsafe_op_in_unsafe_fn = "deny"
# a Result that is dropped unseen is how write errors get lost
unused_must_use = "deny"

[lints.clippy]
# debugging leftovers and unfinished code must not reach main
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# BUILD-027: line tables only (backtraces keep file:line); keeps each worktree's target/ small
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# The release profile drops the symbol table (BUILD-044): about 18 MB of the executable.
[profile.release]
strip = "symbols"

# What the GitHub release builds ship (BUILD-044): fat LTO and one codegen unit make the executable
# about 11 MB smaller and the build about four times longer, so `cargo build --release` and
# `cargo test --release` (scripts/land.sh --release, the checks) stay on the plain release profile.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# What scripts/bench.sh builds (BUILD-038): the release profile with symbols and line tables, so a
# flamegraph names functions and lines.
[profile.bench-release]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# What scripts/size-report.sh builds (BUILD-045): the release profile with the symbols kept (strip = "none", the
# release profile strips), for the linker map of the binary size report. No LTO (the release profile has none), which would merge all
# crates into one object and make the attribution to a crate impossible.
[profile.size-report]
inherits = "release"
strip = "none"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# named time zones (CalDAV TZID): Windows has no zoneinfo files, so the database is compiled in
jiff-tzdb = "1"
# the few Win32 calls Shale needs: no-replace rename, VirtualLock, local time zone, opening files, the parent console, owner-only access lists
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# drag and drop from other programs on Wayland (the window toolkit only does it on X11)
winit = "0.30"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# a fake compositor in the tests of the drop glue (DEV-022)
wayland-server = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
# the Keychain (secrets/keychain.rs); the versions the TLS stack already pulls in
security-framework = "3.7"
security-framework-sys = "2.17"

# PDF rendering (hayro) needs crates that are not in the offline build cache;
# their unmodified sources are kept in vendor/ (licences: MIT / Apache-2.0 / BSD-3-Clause).
[patch.crates-io]
brotli = { path = "vendor/brotli-8.0.4" }
# the CSL reader of hayagriva with quick-xml 0.41 for 0.38.4, which RUSTSEC-2026-0194 and RUSTSEC-2026-0195 hit (#646)
citationberg = { path = "vendor/citationberg-0.7.0" }
fearless_simd_07 = { path = "vendor/fearless_simd-0.7.0", package = "fearless_simd" }
fearless_simd_12 = { path = "vendor/fearless_simd-1.2.0", package = "fearless_simd" }
glifo = { path = "vendor/glifo-0.4.0" }
hayro = { path = "vendor/hayro-0.9.0" }
hayro-ccitt = { path = "vendor/hayro-ccitt-0.5.0" }
hayro-cmap = { path = "vendor/hayro-cmap-0.1.1" }
hayro-font = { path = "vendor/hayro-font-0.5.0" }
hayro-interpret = { path = "vendor/hayro-interpret-0.9.0" }
hayro-jbig2 = { path = "vendor/hayro-jbig2-0.4.0" }
hayro-jpeg2000 = { path = "vendor/hayro-jpeg2000-0.5.0" }
hayro-postscript = { path = "vendor/hayro-postscript-0.2.0" }
hayro-syntax = { path = "vendor/hayro-syntax-0.9.0" }
phf = { path = "vendor/phf-0.13.1" }
phf_generator = { path = "vendor/phf_generator-0.13.1" }
phf_macros = { path = "vendor/phf_macros-0.13.1" }
phf_shared = { path = "vendor/phf_shared-0.13.1" }
pic-scale = { path = "vendor/pic-scale-0.7.12" }
read-fonts = { path = "vendor/read-fonts-0.46.0" }
skrifa = { path = "vendor/skrifa-0.49.0" }
vello_common = { path = "vendor/vello_common-0.3.0" }
vello_cpu = { path = "vendor/vello_cpu-0.3.0" }

[[example]]
name = "loc_report"
test = true

[[example]]
name = "size_report"
test = true

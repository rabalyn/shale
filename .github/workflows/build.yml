# GitHub builds only releases (ADR-0017): this workflow runs for version tags and by hand, never
# for a push to `main` (which reaches GitHub from Forgejo's mirror job, BUILD-016) or a pull
# request, so the public runners are not used for day-to-day work. Day-to-day CI for Linux and the
# daily dependency audit run on the homelab Forgejo instead: .forgejo/workflows/ci.yml and
# security.yml.
# 1. Releases (BUILD-012): GitHub gets the release tags that scripts/make-release.sh pushes to
#    Forgejo, from Forgejo's `mirror` job once they passed CI there (BUILD-016).
#    - every version tag (v0.2.0, ...): the jobs `linux`, `macos` and `windows` check, build and
#      test it again on their system, and each packages its download (BUILD-010, BUILD-024) after
#      the tests passed and uploads it as a workflow artifact; then the job `release` attests all
#      the files at once and publishes a release page named after the version, with that version's
#      notes from CHANGELOG.md (the tag must match the version in Cargo.toml), the three
#      downloads (Linux tarball, macOS arm64 tarball, Windows zip, all unsigned), the zip of the
#      user guide (DEV-020) and the guide as a PDF (BUILD-023), their .sha256 files and the
#      build attestation. A red macOS or Windows job stops the release.
#    - workflow_dispatch: the same checks, builds and attestation without publishing, to try the
#      workflow (the files are workflow artifacts)
#    The attestation (BUILD-014) is keyless: GitHub signs it through Sigstore with a short-lived
#    certificate naming this repository, this workflow and the tag, so there is no key to keep.
# 2. macOS and Windows (BUILD-005, BUILD-017, BUILD-024): the homelab cannot run those systems, so
#    the jobs `macos` and `windows` lint, build, test and package Shale there. They publish
#    nothing themselves (the job `release` does), and the downloads are not signed or notarised.
name: build

on:
  push:
    # release tags only: a pre-release check tag (vX.Y.Z-rc.N, FORGE-013) stays on Forgejo and is
    # never built here, even if it is pushed by hand
    tags: ['v*', '!v*-*']
  workflow_dispatch:

# each job asks for what it needs
permissions: {}

jobs:
  linux:
    permissions:
      contents: read
    env:
      # always strict: any warning (also in vendored crates) fails the build
      RUSTFLAGS: -D warnings
    # an older Ubuntu, so the program also runs on older distributions (glibc 2.35)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the release check compares with the previous tag and reads the commits since it
          fetch-depth: 0

      - name: Check the release and write its notes (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sh .github/check-release.sh "$TAG"
          sh .github/check-ai-notice.sh
          sh .github/release-notes.sh "$TAG" > release-notes.md
          cat release-notes.md

      - name: Libraries for the window (Wayland, X11, OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libwayland-dev libxkbcommon-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev curl git-lfs ffmpeg

      # the version comes from rust-toolchain.toml, so CI and local builds use the same compiler
      # and clippy (a new stable release can add lints that fail `-D warnings` overnight)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          mkdir -p dist/shale
          cp target/release/shale LICENSE README.md CHANGELOG.md dist/shale/
          cp assets/icon/shale.desktop assets/icon/shale.svg dist/shale/
          cp -r docs dist/shale/
          # DEV-020: the guide is in the archive once, as docs/userguide (FEATURES.md links into it),
          # without what Shale writes into a vault; and as a zip of its own
          rm -rf dist/shale/docs/userguide
          scripts/userguide-dist.sh dist/shale/docs/userguide
          tar -C dist -czf shale-linux-x86_64.tar.gz shale
          sha256sum shale-linux-x86_64.tar.gz > shale-linux-x86_64.tar.gz.sha256
          sha256sum -c shale-linux-x86_64.tar.gz.sha256
          scripts/userguide-dist.sh dist/zip/userguide
          (cd dist/zip && zip -qr ../../shale-userguide.zip userguide)
          unzip -tq shale-userguide.zip
          # BUILD-023: the guide as one PDF, a book (BOOK-011), made by this release build without a window
          SHALE=target/release/shale scripts/userguide-pdf.sh shale-userguide.pdf
          test "$(head -c 4 shale-userguide.pdf)" = "%PDF"

      # the files as they are published: versioned for a tag, "dev-<commit>" for a run by hand
      - name: Name the release files
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) LABEL="${GITHUB_REF_NAME#v}" ;;
            *) LABEL="dev-${GITHUB_SHA::7}" ;;
          esac
          ASSET="shale-${LABEL}-linux-x86_64.tar.gz"
          mkdir -p release
          cp shale-linux-x86_64.tar.gz "release/$ASSET"
          GUIDE="shale-userguide-${LABEL}.zip"
          cp shale-userguide.zip "release/$GUIDE"
          PDF="shale-userguide-${LABEL}.pdf"
          cp shale-userguide.pdf "release/$PDF"
          # the checksum names the file as it is downloaded, so `sha256sum -c` works on it
          (cd release && for f in "$ASSET" "$GUIDE" "$PDF"; do sha256sum "$f" > "$f.sha256" && sha256sum -c "$f.sha256"; done)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shale-linux-x86_64
          path: release/

  # Shale on macOS and on Windows (BUILD-017): each lints the code of its own system (the `cfg`
  # parts), builds and tests it. Same pinned actions and compiler as the Linux job.
  macos:
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the sync tests of Git LFS need it (SYNC-017); the runner image usually has it already
      - name: Git LFS
        run: command -v git-lfs >/dev/null || brew install git-lfs

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      # ffmpeg: the video tests run with it (MEDIA-009); they skip with a note without it (BUILD-018)
      - name: ffmpeg
        run: brew install ffmpeg

      - name: Test
        run: cargo test --release --locked

      # BUILD-024: the download, packed like the Linux one (same files, no desktop file) after the
      # tests passed; not signed (the arm64 linker only ad-hoc-signs the binary)
      - name: Package
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) LABEL="${GITHUB_REF_NAME#v}" ;;
            *) LABEL="dev-${GITHUB_SHA::7}" ;;
          esac
          mkdir -p dist/shale release
          cp target/release/shale LICENSE README.md CHANGELOG.md dist/shale/
          mkdir -p dist/shale/assets/icon
          cp assets/icon/shale.svg assets/icon/shale-512.png dist/shale/assets/icon/
          cp -r docs dist/shale/
          # DEV-020: the guide is in the archive once, as docs/userguide, without what Shale writes into a vault
          rm -rf dist/shale/docs/userguide
          scripts/userguide-dist.sh dist/shale/docs/userguide
          ASSET="shale-${LABEL}-macos-arm64.tar.gz"
          tar -C dist -czf "release/$ASSET" shale
          cd release
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          shasum -a 256 -c "$ASSET.sha256"
          tar -tzf "$ASSET" > /dev/null
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shale-macos-arm64
          path: release/

  windows:
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      # ffmpeg for the video tests (MEDIA-009); if Chocolatey cannot get it the tests skip with a note
      - name: ffmpeg
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress

      - name: Test
        run: cargo test --release --locked

      # BUILD-024: the download, packed like the Linux one (same files, no desktop file) after the
      # tests passed; not signed (the arm64 linker only ad-hoc-signs the binary)
      - name: Package
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) LABEL="${GITHUB_REF_NAME#v}" ;;
            *) LABEL="dev-${GITHUB_SHA::7}" ;;
          esac
          mkdir -p dist/shale release
          cp target/release/shale.exe LICENSE README.md CHANGELOG.md dist/shale/
          mkdir -p dist/shale/assets/icon
          cp assets/icon/shale.svg assets/icon/shale-512.png dist/shale/assets/icon/
          cp -r docs dist/shale/
          # DEV-020: the guide is in the archive once, as docs/userguide, without what Shale writes into a vault
          rm -rf dist/shale/docs/userguide
          scripts/userguide-dist.sh dist/shale/docs/userguide
          ASSET="shale-${LABEL}-windows-x86_64.zip"
          (cd dist && 7z a -tzip -bso0 "../release/$ASSET" shale)
          cd release
          sha256sum "$ASSET" > "$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
          7z t -bso0 "$ASSET"
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shale-windows-x86_64
          path: release/

  # The release (BUILD-014, BUILD-024): one attestation for every file of the three systems, checked
  # the way a downloader checks it, and on a tag the release page. It runs only when `linux`,
  # `macos` and `windows` all passed, so a red job on any system stops the release. This is the
  # only job that may write.
  release:
    needs: [linux, macos, windows]
    permissions:
      contents: write # the release page
      id-token: write # the OIDC token that Sigstore turns into the signing certificate
      attestations: write # store the attestation with the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shale-*-*
          path: release/
          merge-multiple: true

      - name: Name the release files
        id: files
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) LABEL="${GITHUB_REF_NAME#v}" ;;
            *) LABEL="dev-${GITHUB_SHA::7}" ;;
          esac
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "linux=shale-${LABEL}-linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "macos=shale-${LABEL}-macos-arm64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "windows=shale-${LABEL}-windows-x86_64.zip" >> "$GITHUB_OUTPUT"
          echo "guide=shale-userguide-${LABEL}.zip" >> "$GITHUB_OUTPUT"
          echo "pdf=shale-userguide-${LABEL}.pdf" >> "$GITHUB_OUTPUT"
          ls -l release

      # every file is there and matches its checksum (the files come from other jobs)
      - name: Check the files
        env:
          FILES: ${{ steps.files.outputs.linux }} ${{ steps.files.outputs.macos }} ${{ steps.files.outputs.windows }} ${{ steps.files.outputs.guide }} ${{ steps.files.outputs.pdf }}
        run: |
          cd release
          for f in $FILES; do test -s "$f" && sha256sum -c "$f.sha256"; done
          test "$(ls | wc -l)" = 10

      - name: Release notes (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh .github/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      # SLSA build provenance for all the files and their checksums, signed keyless (BUILD-014)
      - name: Attest the build
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/${{ steps.files.outputs.linux }}
            release/${{ steps.files.outputs.linux }}.sha256
            release/${{ steps.files.outputs.macos }}
            release/${{ steps.files.outputs.macos }}.sha256
            release/${{ steps.files.outputs.windows }}
            release/${{ steps.files.outputs.windows }}.sha256
            release/${{ steps.files.outputs.guide }}
            release/${{ steps.files.outputs.guide }}.sha256
            release/${{ steps.files.outputs.pdf }}
            release/${{ steps.files.outputs.pdf }}.sha256

      # the bundle goes next to the files, and is checked the way a downloader checks it, so a
      # release never goes out with an attestation that does not verify
      - name: Keep and check the attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.files.outputs.linux }}
          MACOS: ${{ steps.files.outputs.macos }}
          WINDOWS: ${{ steps.files.outputs.windows }}
          GUIDE: ${{ steps.files.outputs.guide }}
          PDF: ${{ steps.files.outputs.pdf }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "release/$ASSET.sigstore.json"
          for f in "$ASSET" "$ASSET.sha256" "$MACOS" "$MACOS.sha256" "$WINDOWS" "$WINDOWS.sha256" "$GUIDE" "$GUIDE.sha256" "$PDF" "$PDF.sha256"; do
            gh attestation verify "release/$f" --bundle "release/$ASSET.sigstore.json" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          ls -l release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shale-attestation
          path: release/*.sigstore.json

      - name: Publish the version's release page (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.files.outputs.linux }}
          MACOS: ${{ steps.files.outputs.macos }}
          WINDOWS: ${{ steps.files.outputs.windows }}
          GUIDE: ${{ steps.files.outputs.guide }}
          PDF: ${{ steps.files.outputs.pdf }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            printf '\n## Downloads\n\n'
            printf -- '- Linux (x86_64): `%s`\n- macOS (Apple silicon, arm64): `%s`\n- Windows (x86_64): `%s`\n\n' "$ASSET" "$MACOS" "$WINDOWS"
            printf '## Unsigned builds\n\n'
            printf 'The macOS and Windows downloads are not signed or notarised, so the system warns before the first start. macOS (Gatekeeper) blocks a downloaded unsigned program: run `xattr -dr com.apple.quarantine shale/` once in the unpacked folder (or `xattr -d com.apple.quarantine shale/shale` for the program only), or allow it in System Settings, Privacy & Security. Windows (SmartScreen) shows "Windows protected your PC": choose More info, then Run anyway.\n\n'
            printf '## Checking the download\n\n'
            printf 'Against damage, with the file and its .sha256 file in one folder. Linux: `sha256sum -c %s.sha256`. macOS: `shasum -a 256 -c %s.sha256`. Windows: `certutil -hashfile %s SHA256` (or PowerShell `Get-FileHash %s`) and compare the hash with the one in `%s.sha256`. The user guide files `%s` and `%s` are checked like the Linux file.\n\n' "$ASSET" "$MACOS" "$WINDOWS" "$WINDOWS" "$WINDOWS" "$GUIDE" "$PDF"
            printf 'That it was built from the tag `%s` by this repository'"'"'s release workflow on GitHub (needs the GitHub CLI; add `--bundle %s.sigstore.json` to use the attestation file from this page):\n\n' "$GITHUB_REF_NAME" "$ASSET"
            printf '```sh\ngh attestation verify %s --repo %s --signer-workflow %s/.github/workflows/build.yml --source-ref %s\n```\nThe same file attests the macOS file `%s`, the Windows file `%s`, the user guide zip `%s` and its PDF `%s`.\n' "$ASSET" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$MACOS" "$WINDOWS" "$GUIDE" "$PDF"
          } >> release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Shale $VERSION" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Shale $VERSION" --notes-file release-notes.md --verify-tag
          fi

# GitHub does two jobs for Shale. Day-to-day CI for Linux (every push and pull request, and the
# weekly dependency audit) runs on the homelab Forgejo instance instead: .forgejo/workflows/ci.yml.
# 1. Releases (BUILD-012): GitHub gets the version tags that make-release.sh pushes.
#    - every version tag (v0.2.0, ...): checks, builds and tests it again on Linux, and publishes a
#      release page named after the version, with that version's notes from CHANGELOG.md (the tag
#      must match the version in Cargo.toml), the tarball, its .sha256 file and its build attestation
#    - workflow_dispatch: the same checks, build and attestation without publishing, to try the
#      workflow (the files are a workflow artifact)
#    The attestation (BUILD-014) is keyless: GitHub signs it through Sigstore with a short-lived
#    certificate naming this repository, this workflow and the tag, so there is no key to keep.
# 2. macOS and Windows (BUILD-005, BUILD-017): the homelab cannot run those systems, so the jobs
#    `macos` and `windows` lint, build and test Shale there on every push to `main` (the Forgejo
#    mirror job pushes `main` here once Forgejo's CI has passed, BUILD-016) and by hand. They
#    publish nothing; the Linux release job and the audit do not run for a push to `main`. A red
#    run is reported back to Forgejo as an issue by .forgejo/workflows/github-report.yml (BUILD-020).
name: build

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

# each job asks for what it needs
permissions: {}

jobs:
  linux:
    # releases only: a push to `main` runs the macOS and Windows jobs
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # the release page
      id-token: write # the OIDC token that Sigstore turns into the signing certificate
      attestations: write # store the attestation with the repository
    env:
      # always strict: any warning (also in vendored crates) fails the build
      RUSTFLAGS: -D warnings
    # an older Ubuntu, so the program also runs on older distributions (glibc 2.35)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the release check compares with the previous tag and reads the commits since it
          fetch-depth: 0

      - name: Check the release and write its notes (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sh .github/check-release.sh "$TAG"
          sh .github/check-ai-notice.sh
          sh .github/release-notes.sh "$TAG" > release-notes.md
          cat release-notes.md

      - name: Libraries for the window (Wayland, X11, OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libwayland-dev libxkbcommon-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev curl

      # the version comes from rust-toolchain.toml, so CI and local builds use the same compiler
      # and clippy (a new stable release can add lints that fail `-D warnings` overnight)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          mkdir -p dist/shale
          cp target/release/shale LICENSE README.md CHANGELOG.md dist/shale/
          cp assets/icon/shale.desktop assets/icon/shale.svg dist/shale/
          cp -r docs dist/shale/
          tar -C dist -czf shale-linux-x86_64.tar.gz shale
          sha256sum shale-linux-x86_64.tar.gz > shale-linux-x86_64.tar.gz.sha256
          sha256sum -c shale-linux-x86_64.tar.gz.sha256

      # the files as they are published: versioned for a tag, "dev-<commit>" for a run by hand
      - name: Name the release files
        id: files
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) LABEL="${GITHUB_REF_NAME#v}" ;;
            *) LABEL="dev-${GITHUB_SHA::7}" ;;
          esac
          ASSET="shale-${LABEL}-linux-x86_64.tar.gz"
          mkdir -p release
          cp shale-linux-x86_64.tar.gz "release/$ASSET"
          # the checksum names the file as it is downloaded, so `sha256sum -c` works on it
          (cd release && sha256sum "$ASSET" > "$ASSET.sha256" && sha256sum -c "$ASSET.sha256")
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      # SLSA build provenance for the tarball and its checksum, signed keyless (BUILD-014)
      - name: Attest the build
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/${{ steps.files.outputs.asset }}
            release/${{ steps.files.outputs.asset }}.sha256

      # the bundle goes next to the files, and is checked the way a downloader checks it, so a
      # release never goes out with an attestation that does not verify
      - name: Keep and check the attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.files.outputs.asset }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "release/$ASSET.sigstore.json"
          for f in "$ASSET" "$ASSET.sha256"; do
            gh attestation verify "release/$f" --bundle "release/$ASSET.sigstore.json" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          ls -l release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shale-linux-x86_64
          path: release/

      - name: Publish the version's release page (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.files.outputs.asset }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            printf '\n## Checking the download\n\n'
            printf 'Against damage, with both files in one folder: `sha256sum -c %s.sha256`\n\n' "$ASSET"
            printf 'That it was built from the tag `%s` by this repository'"'"'s release workflow on GitHub (needs the GitHub CLI; add `--bundle %s.sigstore.json` to use the attestation file from this page):\n\n' "$GITHUB_REF_NAME" "$ASSET"
            printf '```sh\ngh attestation verify %s --repo %s --signer-workflow %s/.github/workflows/build.yml --source-ref %s\n```\n' "$ASSET" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_REF"
          } >> release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Shale $VERSION" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Shale $VERSION" --notes-file release-notes.md --verify-tag
          fi

  # Shale on macOS and on Windows (BUILD-017): each lints the code of its own system (the `cfg`
  # parts), builds and tests it. Same pinned actions and compiler as the Linux job.
  macos:
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

  windows:
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

  # separate from the build, so an advisory shows up as a red job of its own but never blocks the
  # release (Forgejo runs the same audit on every push and weekly)
  audit:
    # Forgejo audits every push already, so a push to `main` does not run it here
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # reads only Cargo.lock, so it needs no build and no system libraries
      - name: Audit the dependencies
        run: cargo audit

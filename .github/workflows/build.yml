# Builds Shale on every push to main and publishes the newest build as the "latest" release,
# so it can be downloaded from any machine: https://github.com/<owner>/<repo>/releases/tag/latest
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # an older Ubuntu, so the program also runs on older distributions (glibc 2.35)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Libraries for the window (Wayland, X11, OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev curl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          mkdir -p dist/shale
          cp target/release/shale LICENSE README.md dist/shale/
          cp -r docs dist/shale/
          tar -C dist -czf shale-linux-x86_64.tar.gz shale

      - uses: actions/upload-artifact@v4
        with:
          name: shale-linux-x86_64
          path: shale-linux-x86_64.tar.gz

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Newest build of ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M UTC')). Download shale-linux-x86_64.tar.gz, unpack it and run ./shale/shale"
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest shale-linux-x86_64.tar.gz --clobber
            gh release edit latest --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create latest shale-linux-x86_64.tar.gz --prerelease --title "Latest build" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          # move the tag to this build
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest

# Builds and publishes Shale's releases on GitHub. Day-to-day CI (every push and pull request,
# and the weekly dependency audit) runs on the homelab Forgejo instead: .forgejo/workflows/ci.yml.
# GitHub only gets `main` and the version tags that make-release.sh pushes.
# - every version tag (v0.2.0, …): checks, builds and tests it again, and publishes a release page
#   named after the version, with that version's notes from CHANGELOG.md (the tag must match the
#   version in Cargo.toml) and the tarball with its .sha256 file
# - workflow_dispatch: the same checks and build without publishing, to try the workflow
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    env:
      # always strict: any warning (also in vendored crates) fails the build
      RUSTFLAGS: -D warnings
    # an older Ubuntu, so the program also runs on older distributions (glibc 2.35)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the version and the release notes (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::tag v$TAG does not match the version $CARGO in Cargo.toml"
            exit 1
          fi
          sh .github/release-notes.sh "$TAG" > release-notes.md
          cat release-notes.md

      - name: Libraries for the window (Wayland, X11, OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev curl

      # the version comes from rust-toolchain.toml, so CI and local builds use the same compiler
      # and clippy (a new stable release can add lints that fail `-D warnings` overnight)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          mkdir -p dist/shale
          cp target/release/shale LICENSE README.md CHANGELOG.md dist/shale/
          cp -r docs dist/shale/
          tar -C dist -czf shale-linux-x86_64.tar.gz shale
          sha256sum shale-linux-x86_64.tar.gz > shale-linux-x86_64.tar.gz.sha256
          sha256sum -c shale-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shale-linux-x86_64
          path: |
            shale-linux-x86_64.tar.gz
            shale-linux-x86_64.tar.gz.sha256

      - name: Publish the version's release page (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="shale-${VERSION}-linux-x86_64.tar.gz"
          cp shale-linux-x86_64.tar.gz "$ASSET"
          # the checksum names the file as it is downloaded, so `sha256sum -c` works on it
          sha256sum "$ASSET" > "$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
          printf '\nTo check the download: `sha256sum -c %s.sha256` (both files in one folder).\n' "$ASSET" >> release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Shale $VERSION" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" "$ASSET.sha256" --title "Shale $VERSION" --notes-file release-notes.md --verify-tag
          fi

  # separate from the build, so an advisory shows up as a red job of its own but never blocks the
  # release (Forgejo runs the same audit on every push and weekly)
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # reads only Cargo.lock, so it needs no build and no system libraries
      - name: Audit the dependencies
        run: cargo audit
